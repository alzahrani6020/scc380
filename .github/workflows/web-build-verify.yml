name: Web Build Verify

on:
  push:
    branches:
      - feat/supplier-invoice-workspace
    paths:
      - "apps/web/**"
      - "packages/types/**"
      - "packages/ui/**"
      - "packages/utils/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/web-build-verify.yml"
      - ".github/workflows/vercel-deploy.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/types/**"
      - "packages/ui/**"
      - "packages/utils/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/web-build-verify.yml"

permissions:
  contents: read

jobs:
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Live API login acceptance runs separately by explicit dispatch.
      # Repeated PR probes trigger production auth rate limiting (HTTP 429).
      - name: Prove dashboard zero-versus-unknown behavior
        run: pnpm exec tsx --test apps/web/test/dashboard-data-integrity.spec.ts
      - run: pnpm --filter @scc/web build
