name: Web Build Verify

on:
  push:
    branches:
      - feat/supplier-invoice-workspace
    paths:
      - "apps/web/**"
      - "packages/types/**"
      - "packages/ui/**"
      - "packages/utils/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/web-build-verify.yml"
      - ".github/workflows/vercel-deploy.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/types/**"
      - "packages/ui/**"
      - "packages/utils/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/web-build-verify.yml"

permissions:
  contents: read

jobs:
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Live API direct-login CORS and JSON acceptance
        run: |
          set -euo pipefail
          api=https://scc380-api.onrender.com/auth/login
          origin=https://dr-talal-h-alzahrani.com

          curl -sS --max-time 30 -D /tmp/cors-headers -o /tmp/cors-body \
            -X OPTIONS "$api" \
            -H "Origin: $origin" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            -w 'CORS_PREFLIGHT_HTTP=%{http_code}\\n'
          grep -iq "^access-control-allow-origin: $origin" /tmp/cors-headers
          grep -iq "^access-control-allow-credentials: true" /tmp/cors-headers

          code=$(curl -sS --max-time 40 -D /tmp/login-headers \
            -o /tmp/login-body -w '%{http_code}' \
            -X POST "$api" -H "Origin: $origin" \
            -H 'Content-Type: application/json' \
            --data '{"email":"auth-ci-check@example.invalid","password":"ci-no-real-account"}')
          echo "DIRECT_LOGIN_HTTP=$code"
          if [ "$code" != "401" ]; then
            echo "::error::Unexpected direct API login status $code"
            exit 1
          fi
          grep -iq "^x-scc-auth-origin: nest-api" /tmp/login-headers
          grep -iq "^access-control-allow-origin: $origin" /tmp/login-headers
          echo DIRECT_LOGIN_PRODUCTION_ACCEPTANCE_PASS

      - run: pnpm --filter @scc/web build
