name: Web Build Verify

on:
  push:
    branches:
      - feat/finance-workspace-completion
    paths:
      - "apps/web/**"
      - "packages/types/**"
      - "packages/ui/**"
      - "packages/utils/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/web-build-verify.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/types/**"
      - "packages/ui/**"
      - "packages/utils/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/web-build-verify.yml"

permissions:
  contents: read

jobs:
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scc/web build
