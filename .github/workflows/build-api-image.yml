name: Build SCC380 API Image

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/build-api-image.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          build-args: |
            NODE_MAX_HEAP=1536
          tags: |
            ghcr.io/alzahrani6020/scc380-api-prod:latest
            ghcr.io/alzahrani6020/scc380-api-prod:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin Render Blueprint to built image
        env:
          IMAGE_TAG: ghcr.io/alzahrani6020/scc380-api-prod:${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::error::main advanced while this image was building; refusing to pin a stale image."
            exit 1
          fi

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("render.yaml")
          text = path.read_text()
          image = os.environ["IMAGE_TAG"]
          updated, count = re.subn(
              r'(?m)^(\s*url:\s*)ghcr\.io/alzahrani6020/scc380-api-prod:[^\s]+\s*$',
              rf'\1{image}',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("RENDER_IMAGE_URL_NOT_FOUND")
          path.write_text(updated)
          PY

          git add render.yaml
          if git diff --cached --quiet; then
            echo "Render Blueprint already points at this image."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(render): pin API image to $GITHUB_SHA [skip ci]"
          git push origin HEAD:main
