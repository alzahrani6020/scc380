name: P0 Combined API-Web Acceptance

on:
  pull_request:
    branches:
      - fix/p0-production-restore-guard-20261127
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-p0:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scc
          POSTGRES_PASSWORD: ci-only-scc
          POSTGRES_DB: scc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scc -d scc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://scc:ci-only-scc@127.0.0.1:5432/scc_test
      DIRECT_URL: postgresql://scc:ci-only-scc@127.0.0.1:5432/scc_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-only-jwt-secret-do-not-use-in-production-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm 8.15.0
        run: |
          corepack enable
          corepack prepare pnpm@8.15.0 --activate
      - name: Verify the P0 security and UI branches were combined
        run: |
          set -euo pipefail
          test -f apps/api/test/p0-authenticated-tenant-switch-db.e2e.spec.ts
          test -f apps/api/test/p0-tenant-role-isolation-db.e2e.spec.ts
          test -f apps/web/test/hr-browser-acceptance.cjs
          test -f apps/web/src/lib/dashboard-data-integrity.ts
          echo 'P0_BOTH_BRANCH_FEATURES_PRESENT'
      - name: Install and generate Prisma client
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @scc/database db:generate
      - name: Build shared packages and apply migrations to disposable PostgreSQL
        run: |
          pnpm --filter @scc/database build
          pnpm turbo run build --filter=@scc/auth...
          pnpm --filter @scc/database exec prisma migrate deploy --schema prisma/schema.prisma
      - name: Test authenticated company selection and roles on PostgreSQL
        env:
          CRM_DB_E2E: "1"
        run: |
          pnpm --filter @scc/api exec tsx --test --test-concurrency=1 \
            test/p0-tenant-role-isolation-db.e2e.spec.ts \
            test/p0-authenticated-tenant-switch-db.e2e.spec.ts
      - name: Build complete API and the Next.js web together
        run: |
          pnpm turbo run build --filter=@scc/api...
          pnpm --filter @scc/web build
      - name: Prove dashboard truthfulness unit regression
        run: pnpm exec tsx --test apps/web/test/dashboard-data-integrity.spec.ts
      - name: Confirm both P0 branches pass a common build and tenant gate
        run: echo 'PASS P0_CROSS_BRANCH_API_WEB_AND_TENANT_ISOLATION_CI'
