name: SCC380 public API 404 source probe
on:
  push:
    branches:
      - diagnose/scc380-authenticated-404-source-20261118
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Compare API route and tenant middleware without credentials
        shell: bash
        run: |
          set -u
          for origin in "https://dr-talal-h-alzahrani.com/api" "https://scc380-api.onrender.com" "https://api.dr-talal-h-alzahrani.com"; do
            for path in "/auth/me" "/crm/deals?page=1&limit=25" "/crm/companies"; do
              for mode in none bogus; do
                echo "PROBE origin=$origin path=$path tenant=$mode"
                args=()
                if [ "$mode" = bogus ]; then args=(-H "X-Tenant-Slug: nonexistent-qa-probe-20261118"); fi
                curl -sS -o /tmp/scc-probe-out -w 'HTTP=%{http_code} CONTENT_TYPE=%{content_type} REMOTE_IP=%{remote_ip}\n' --max-time 16 "${args[@]}" "$origin$path" || true
                if [ -f /tmp/scc-probe-out ]; then head -c 300 /tmp/scc-probe-out | tr '\n' ' '; echo; fi
              done
            done
          done
