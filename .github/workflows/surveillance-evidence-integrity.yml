name: Surveillance Local Evidence Integrity
on:
  pull_request:
    paths:
      - 'scripts/surveillance-evidence-integrity.mjs'
      - 'scripts/surveillance-evidence-integrity.spec.mjs'
      - '.github/workflows/surveillance-evidence-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/surveillance-evidence-integrity.spec.mjs
