name: PR 3 API Build Gate

on:
  push:
    branches:
      - feat/scc-intelligence-core

permissions:
  contents: read

jobs:
  api-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scc/database db:generate
      - run: pnpm turbo run build --filter=@scc/api...
