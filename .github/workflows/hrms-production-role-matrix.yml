name: HRMS Production Image Role Matrix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "render.yaml"
      - "scripts/hrms-production-role-matrix-smoke.cjs"
      - ".github/workflows/hrms-production-role-matrix.yml"

permissions:
  contents: read
  packages: read

jobs:
  role-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve immutable production image from render.yaml
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="$(grep -Eo 'ghcr\.io/alzahrani6020/scc380-api-prod:[0-9a-f]{40}' render.yaml | head -n1)"
          test -n "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Testing pinned production image tag: ${image##*:}"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Start ephemeral PostgreSQL and Redis
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name role-smoke-postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=scc_role_smoke \
            -p 5432:5432 postgres:17-alpine
          docker run -d --name role-smoke-redis -p 6379:6379 redis:7-alpine

          for i in $(seq 1 60); do
            if docker exec role-smoke-postgres pg_isready -U postgres -d scc_role_smoke >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs role-smoke-postgres
          exit 1

      - name: Start exact production API image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run -d --name role-smoke-api --network host \
            -e DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:5432/scc_role_smoke?schema=public' \
            -e DIRECT_URL='postgresql://postgres:postgres@127.0.0.1:5432/scc_role_smoke?schema=public' \
            -e REDIS_URL='redis://127.0.0.1:6379' \
            -e JWT_SECRET='role-smoke-ci-only-not-production-secret' \
            -e JWT_EXPIRES_IN='1h' \
            -e REFRESH_TOKEN_EXPIRES_IN='1h' \
            -e CORS_ORIGINS='http://127.0.0.1:3000' \
            -e NODE_ENV='production' \
            -e PORT='3101' \
            "$IMAGE"

          ready=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3101/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx role-smoke-api; then
              docker logs role-smoke-api
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs role-smoke-api
            exit 1
          fi

      - name: Seed ephemeral role matrix users
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_PASSWORD="RoleSmoke-$(openssl rand -hex 12)-Aa1!"
          echo "::add-mask::$SMOKE_PASSWORD"
          echo "SMOKE_PASSWORD=$SMOKE_PASSWORD" >> "$GITHUB_ENV"

          docker exec -e SMOKE_PASSWORD="$SMOKE_PASSWORD" -i role-smoke-api node <<'NODE'
          const { PrismaClient } = require('/app/packages/database/node_modules/@prisma/client');
          const { hashPassword } = require('/app/packages/auth/dist/index.js');

          (async () => {
            const prisma = new PrismaClient();
            const passwordHash = await hashPassword(process.env.SMOKE_PASSWORD);
            try {
              await prisma.tenant.createMany({
                data: [
                  { id: 'role-smoke-tenant-a', name: 'Role Smoke A', slug: 'role-smoke-a', status: 'ACTIVE', plan: 'BASIC' },
                  { id: 'role-smoke-tenant-b', name: 'Role Smoke B', slug: 'role-smoke-b', status: 'ACTIVE', plan: 'BASIC' },
                ],
              });
              await prisma.user.createMany({
                data: [
                  { id: 'role-smoke-admin-a', email: 'admin-a@role-smoke.invalid', passwordHash, firstName: 'Admin', lastName: 'Smoke', role: 'ADMIN', status: 'ACTIVE', tenantId: 'role-smoke-tenant-a' },
                  { id: 'role-smoke-manager-a', email: 'manager-a@role-smoke.invalid', passwordHash, firstName: 'Manager', lastName: 'Smoke', role: 'MANAGER', status: 'ACTIVE', tenantId: 'role-smoke-tenant-a' },
                  { id: 'role-smoke-auditor-a', email: 'auditor-a@role-smoke.invalid', passwordHash, firstName: 'Auditor', lastName: 'Smoke', role: 'AUDITOR', status: 'ACTIVE', tenantId: 'role-smoke-tenant-a' },
                  { id: 'role-smoke-readonly-a', email: 'readonly-a@role-smoke.invalid', passwordHash, firstName: 'Readonly', lastName: 'Smoke', role: 'READONLY', status: 'ACTIVE', tenantId: 'role-smoke-tenant-a' },
                  { id: 'role-smoke-admin-b', email: 'admin-b@role-smoke.invalid', passwordHash, firstName: 'Admin', lastName: 'Other', role: 'ADMIN', status: 'ACTIVE', tenantId: 'role-smoke-tenant-b' },
                ],
              });
            } finally {
              await prisma.$disconnect();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Run authenticated role matrix
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3101
          SMOKE_PASSWORD: ${{ env.SMOKE_PASSWORD }}
        run: node scripts/hrms-production-role-matrix-smoke.cjs

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker ps -a || true
          docker logs role-smoke-api || true

      - name: Destroy ephemeral test environment
        if: always()
        run: |
          docker rm -f role-smoke-api role-smoke-postgres role-smoke-redis >/dev/null 2>&1 || true
