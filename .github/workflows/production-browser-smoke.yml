name: SCC380 Production Browser Smoke (read-only)

on:
  pull_request:
    paths:
      - "apps/web/e2e/production-login-smoke.mjs"
      - "apps/web/e2e/production-refresh-isolated.mjs"
      - "apps/web/e2e/production-refresh-authorized.mjs"
      - ".github/workflows/production-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify browser smoke syntax
        run: node --check apps/web/e2e/production-login-smoke.mjs
      - name: Install Playwright without modifying tracked lockfile
        run: npm install --prefix /tmp/scc-smoke playwright@1.65.0
      - name: Install Chromium
        run: /tmp/scc-smoke/node_modules/.bin/playwright install --with-deps chromium
      - name: Run read-only production browser acceptance
        env:
          NODE_PATH: /tmp/scc-smoke/node_modules
        run: |
          cp apps/web/e2e/production-login-smoke.mjs /tmp/scc-smoke/production-login-smoke.mjs
          node /tmp/scc-smoke/production-login-smoke.mjs --ui-only
      - name: Verify isolated browser refresh syntax
        run: node --check apps/web/e2e/production-refresh-isolated.mjs
      - name: Run deployed web 401 refresh and CRM retry with isolated API responses
        run: |
          cp apps/web/e2e/production-refresh-isolated.mjs /tmp/scc-smoke/production-refresh-isolated.mjs
          node /tmp/scc-smoke/production-refresh-isolated.mjs
      - name: Verify authorized acceptance script is syntactically valid
        run: node --check apps/web/e2e/production-refresh-authorized.mjs
      - name: Verify no-credential gate blocks real production authentication
        run: |
          cp apps/web/e2e/production-refresh-authorized.mjs /tmp/scc-smoke/production-refresh-authorized.mjs
          set +e
          env -u SCC_QA_EMAIL -u SCC_QA_PASSWORD -u SCC_QA_TENANT_SLUG -u SCC_QA_APPROVED_PRODUCTION_SESSION node /tmp/scc-smoke/production-refresh-authorized.mjs > /tmp/qa-gate.json
          code=$?
          set -e
          cat /tmp/qa-gate.json
          test "$code" -eq 2
          grep -q '"status":"BLOCKED"' /tmp/qa-gate.json
