name: SCC380 All Pages Public HTTP Audit
on:
  push:
    branches:
      - audit/scc380-http-pages-20261118-v2
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test all page routes without authentication and print a complete audit
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess,concurrent.futures
          root=pathlib.Path('apps/web/src/app')
          files=sorted(root.rglob('page.tsx'))
          def evaluate(file):
            path='/'+str(file.relative_to(root).parent).replace('\\','/')
            if path=='/.': path='/'
            path=path.replace('[id]','__AUDIT_INVALID_ID__').replace('[category]','__AUDIT_INVALID_CATEGORY__')
            if path in ['/.','']:path='/'
            url='https://dr-talal-h-alzahrani.com'+path
            p=subprocess.run(['curl','-sS','--max-time','15','-o','/dev/null','-w','%{http_code}|%{content_type}|%{redirect_url}','--globoff',url],capture_output=True,text=True)
            fields=p.stdout.strip().split('|',2)
            while len(fields)<3:fields.append('')
            return(path,fields[0],fields[1],fields[2],p.returncode)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
            records=list(pool.map(evaluate,files))
          print('AUDIT_BEGIN|'+str(len(files)))
          for path,status,content_type,redirect,rc in records:
            print('AUDIT|'+path+'|'+status+'|'+content_type+'|'+redirect+'|'+str(rc),flush=True)
          print('AUDIT_END|'+str(len(records)),flush=True)
          PY
