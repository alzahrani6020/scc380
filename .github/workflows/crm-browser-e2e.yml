name: CRM Browser E2E

on:
  pull_request:
    paths:
      - "apps/web/src/app/dashboard/crm/**"
      - "apps/web/src/components/ui/AsyncCombobox.tsx"
      - "apps/web/src/lib/api.ts"
      - "apps/web/src/lib/auth.ts"
      - "apps/web/src/middleware.ts"
      - "apps/web/e2e/**"
      - "apps/web/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/crm-browser-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crm-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_URL: /api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright transiently
        run: pnpm add -Dw playwright@1.65.0 --lockfile=false

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build web for local browser test
        run: pnpm --filter @scc/web build

      - name: Start local web
        run: |
          cd apps/web
          pnpm exec next start -H 127.0.0.1 -p 3000 > /tmp/scc-web.log 2>&1 &
          echo $! > /tmp/scc-web.pid

      - name: Wait for local web
        run: |
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/scc-web.log
            exit 1
          fi

      - name: Run CRM browser E2E
        run: node apps/web/e2e/crm-ui.mjs

      - name: Print web log on failure
        if: failure()
        run: cat /tmp/scc-web.log || true
