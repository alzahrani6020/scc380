name: Surveillance Real Media Pipeline (Synthetic Camera)
on:
  pull_request:
    paths:
      - '.github/workflows/surveillance-real-media.yml'
      - 'scripts/surveillance-media-config*.mjs'
      - 'docs/surveillance-on-prem-runbook.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate media configuration generator
        run: node --test scripts/surveillance-media-config.spec.mjs
      - name: Provision isolated synthetic RTSP camera relay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scc380-media/recordings"
          cat > "$RUNNER_TEMP/scc380-media/mediamtx.yml" <<'YAML'
          logLevel: info
          api: false
          metrics: false
          pprof: false
          authMethod: internal
          authInternalUsers:
            - user: "testPublisher"
              pass: "testPublisherSecret"
              ips: ["127.0.0.1", "::1"]
              permissions:
                - action: publish
                  path: "camera12345"
            - user: "testViewer"
              pass: "testViewerSecret"
              ips: ["127.0.0.1", "::1"]
              permissions:
                - action: read
                  path: "camera12345"
                - action: playback
                  path: "camera12345"
          rtspTransports: [tcp]
          rtspAddress: 127.0.0.1:8554
          rtmp: false
          hls: true
          hlsAddress: 127.0.0.1:8888
          hlsVariant: mpegts
          hlsSegmentDuration: 1s
          hlsAlwaysRemux: true
          webrtc: false
          playback: true
          playbackAddress: 127.0.0.1:9996
          paths:
            camera12345:
              source: publisher
              record: true
              recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f_%z
              recordFormat: fmp4
              recordSegmentDuration: 1s
              recordDeleteAfter: 24h
          YAML
          docker run -d --name scc380-synthetic-media --network host \
            -v "$RUNNER_TEMP/scc380-media/mediamtx.yml:/mediamtx.yml:ro" \
            -v "$RUNNER_TEMP/scc380-media/recordings:/recordings" \
            bluenviron/mediamtx:1.21.4 >/dev/null
          echo "$RUNNER_TEMP/scc380-media" > "$RUNNER_TEMP/scc380_media_path"
          for i in $(seq 1 35); do
            if bash -c 'echo >/dev/tcp/127.0.0.1/8554' 2>/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs scc380-synthetic-media
          exit 1
      - name: Install FFmpeg encoder on ephemeral runner
        run: |
          # GitHub ubuntu-24.04 runners normally ship FFmpeg. Avoid unnecessary apt update,
          # which can fail on unrelated third-party Microsoft package mirrors (HTTP 403).
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Check HLS authorization, synthetic video with audio and recorded segments
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg
          ffmpeg -nostdin -hide_banner -loglevel info -re \
            -f lavfi -i "testsrc=size=160x120:rate=10" \
            -f lavfi -i "sine=frequency=440:sample_rate=16000" \
            -t 22 -c:v libx264 -preset ultrafast -tune zerolatency \
            -pix_fmt yuv420p -g 10 -c:a aac -b:a 32k \
            -f rtsp -rtsp_transport tcp \
            "rtsp://testPublisher:testPublisherSecret@127.0.0.1:8554/camera12345" \
            > "$RUNNER_TEMP/synthetic-ffmpeg.log" 2>&1 &
          producer=$!
          trap 'kill "$producer" 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 30); do
            status=$(curl --silent --output "$RUNNER_TEMP/public-hls" \
              --location --max-redirs 3 --write-out '%{http_code}' --max-time 5 \
              "http://127.0.0.1:8888/camera12345/index.m3u8" || true)
            if [ "$i" -eq 1 ] || [ $((i % 10)) -eq 0 ]; then
              echo "HLS_ATTEMPT=$i ANON_HTTP=$status PRODUCER_ALIVE=$(kill -0 \"$producer\" 2>/dev/null && echo YES || echo NO)"
              tail -n 5 "$RUNNER_TEMP/synthetic-ffmpeg.log" || true
            fi
            if [ "$status" = "200" ]; then
              echo "FAIL: anonymous HLS playback exposed"
              exit 1
            fi
            if curl --location --max-redirs 3 --silent --show-error --fail --max-time 5 \
              -u testViewer:testViewerSecret \
              "http://127.0.0.1:8888/camera12345/index.m3u8" \
              -o "$RUNNER_TEMP/playlist.m3u8" 2>/dev/null &&
              grep -q '#EXTM3U' "$RUNNER_TEMP/playlist.m3u8"; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "AUTHORIZED_STATUS=$(curl --location --max-redirs 3 --silent --output /dev/null --write-out '%{http_code}' --max-time 5 -u testViewer:testViewerSecret http://127.0.0.1:8888/camera12345/index.m3u8 || true)"
            cat "$RUNNER_TEMP/synthetic-ffmpeg.log"
            docker logs scc380-synthetic-media
            exit 1
          fi
          wait "$producer"
          trap - EXIT
          MEDIA_ROOT="$(cat "$RUNNER_TEMP/scc380_media_path")"
          if ! find "$MEDIA_ROOT/recordings" -type f -name '*.mp4' -size +0c | grep -q .; then
            echo "FAIL: no recorded video segment"
            find "$MEDIA_ROOT/recordings" -type f || true
            exit 1
          fi
          echo "PASS: synthetic camera video+audio ingested, authenticated HLS produced, anonymous HLS blocked, MP4 recorded"
      - name: Verify private recording index and actual playback recovery
        shell: bash
        run: |
          set -euo pipefail
          unauthorized=$(curl --silent --location --max-redirs 2 --output /dev/null --write-out '%{http_code}' \
            'http://127.0.0.1:9996/list?path=camera12345' || true)
          if [ "$unauthorized" = "200" ]; then
            echo "FAIL: recording index accessible anonymously"
            exit 1
          fi
          curl --silent --show-error --fail --location --max-redirs 2 \
            -u testViewer:testViewerSecret \
            'http://127.0.0.1:9996/list?path=camera12345' \
            -o "$RUNNER_TEMP/recording-index.json"
          python3 - "$RUNNER_TEMP/recording-index.json" "$RUNNER_TEMP/playback-url.txt" <<'PY'
          import json,sys
          from urllib.parse import urlencode
          with open(sys.argv[1]) as f:
              segments=json.load(f)
          assert isinstance(segments,list) and segments, 'No recorded timespans returned'
          start=segments[0]['start']
          duration=float(segments[0]['duration'])
          assert 0 < duration <= 60, 'Recording duration out of expected bound'
          url='http://127.0.0.1:9996/get?'+urlencode({
              'path':'camera12345','start':start,'duration':duration,'format':'mp4'})
          with open(sys.argv[2],'w') as f:
              f.write(url)
          PY
          PLAYBACK_URL="$(cat "$RUNNER_TEMP/playback-url.txt")"
          unauthorized_clip=$(curl --silent --location --max-redirs 2 --output /dev/null \
            --write-out '%{http_code}' "$PLAYBACK_URL" || true)
          if [ "$unauthorized_clip" = "200" ]; then
            echo "FAIL: recorded clip downloadable anonymously"
            exit 1
          fi
          curl --silent --show-error --fail --location --max-redirs 2 --max-time 20 \
            -u testViewer:testViewerSecret "$PLAYBACK_URL" \
            -o "$RUNNER_TEMP/recovered-recording.mp4"
          test -s "$RUNNER_TEMP/recovered-recording.mp4"
          ffprobe -v error -show_entries stream=codec_type \
            -of default=noprint_wrappers=1 "$RUNNER_TEMP/recovered-recording.mp4" \
            > "$RUNNER_TEMP/recovered-codecs.txt"
          grep -q 'codec_type=video' "$RUNNER_TEMP/recovered-codecs.txt"
          grep -q 'codec_type=audio' "$RUNNER_TEMP/recovered-codecs.txt"
          echo "PASS: recording index private, MP4 recovered via playback API, video/audio streams verified"
      - name: Remove isolated media stack
        if: always()
        run: |
          docker logs scc380-synthetic-media || true
          docker rm -f scc380-synthetic-media || true
