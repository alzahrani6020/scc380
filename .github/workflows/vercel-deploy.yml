name: Verify Web Build

on:
  push:
    branches:
      - main

jobs:
  verify-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm --filter @scc/web build
      - name: Deployment ownership
        run: |
          echo "Vercel Git integration owns production deployment."
          echo "This workflow verifies the web build only to avoid duplicate Vercel deployments."
