name: API Build Verify

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/database/**"
      - "packages/auth/**"
      - "packages/types/**"
      - "packages/utils/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/api-build-verify.yml"
      - ".github/workflows/render-deploy.yml"
      - ".github/workflows/build-api-image.yml"
      - "render.yaml"
  push:
    branches:
      - feat/real-estate-activation
    paths:
      - "apps/api/**"
      - "packages/database/**"
      - "packages/auth/**"
      - "packages/types/**"
      - "packages/utils/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/api-build-verify.yml"

permissions:
  contents: read

jobs:
  verify-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm 8.15.0
        run: |
          corepack enable
          corepack prepare pnpm@8.15.0 --activate
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @scc/database db:generate

      - name: Build database package for tests
        run: pnpm --filter @scc/database build

      - name: Build auth dependency graph for tests
        run: pnpm turbo run build --filter=@scc/auth...

      - name: Run API tests
        run: pnpm --filter @scc/api test

      - name: Build API dependency graph
        run: pnpm turbo run build --filter=@scc/api...

      - name: Verify serverless handler export
        run: |
          node - <<'NODE'
          const handler = require('./apps/api/api/index.js');
          if (typeof handler !== 'function') {
            throw new Error('SERVERLESS_HANDLER_NOT_FUNCTION');
          }
          console.log('SERVERLESS_HANDLER_SMOKE_PASS');
          NODE

      - name: Initialize Nest routes on Express 4
        env:
          JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789abcdef
        run: |
          cd apps/api
          node - <<'NODE'
          const { NestFactory } = require('@nestjs/core');
          const { ExpressAdapter } = require('@nestjs/platform-express');
          const expressModule = require('express');
          const express = expressModule.default || expressModule;
          const { AppModule } = require('./dist/app.module.js');

          (async () => {
            const server = express();
            const app = await NestFactory.create(AppModule, new ExpressAdapter(server), { logger: false });
            await app.init();
            await app.close();
            console.log('NEST_ROUTE_INIT_PASS');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
