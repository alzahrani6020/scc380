name: API Build Verify

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/database/**"
      - "packages/auth/**"
      - "packages/types/**"
      - "packages/utils/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/api-build-verify.yml"
      - ".github/workflows/render-deploy.yml"
      - ".github/workflows/build-api-image.yml"
      - "render.yaml"
  push:
    branches:
      - feat/real-estate-activation
    paths:
      - "apps/api/**"
      - "packages/database/**"
      - "packages/auth/**"
      - "packages/types/**"
      - "packages/utils/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/api-build-verify.yml"

permissions:
  contents: read

jobs:
  verify-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scc
          POSTGRES_PASSWORD: scc
          POSTGRES_DB: scc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scc -d scc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://scc:scc@127.0.0.1:5432/scc_test
      DIRECT_URL: postgresql://scc:scc@127.0.0.1:5432/scc_test
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm 8.15.0
        run: |
          corepack enable
          corepack prepare pnpm@8.15.0 --activate
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @scc/database db:generate

      - name: Build database package for tests
        run: pnpm --filter @scc/database build

      - name: Build auth dependency graph for tests
        run: pnpm turbo run build --filter=@scc/auth...

      - name: Run API tests
        run: pnpm --filter @scc/api test

      - name: Apply test database migrations
        run: pnpm --filter @scc/database exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Verify POS migration replays safely and rejects schema drift
        run: |
          set -euo pipefail
          migration="packages/database/prisma/migrations/20261119070000_reconcile_pos_tables/migration.sql"
          # Existing matching schema: running the SQL again must not alter business data.
          if ! psql "$DIRECT_URL" -X -v ON_ERROR_STOP=1 -f "$migration"; then
            psql "$DIRECT_URL" -X -A -F '|' -c "
              SELECT c.relname, a.attname, pg_get_expr(d.adbin,d.adrelid)
              FROM pg_attrdef d
              JOIN pg_attribute a ON a.attrelid=d.adrelid AND a.attnum=d.adnum
              JOIN pg_class c ON c.oid=d.adrelid
              WHERE c.relname IN ('pos_sessions','pos_orders','pos_order_items','pos_payments')
              ORDER BY c.relname,a.attname"
            exit 1
          fi
          echo "POS_MIGRATION_EXISTING_SCHEMA_PASS"
          # Simulate drift inside a transaction. An error must roll back the drop.
          if psql "$DIRECT_URL" -X -v ON_ERROR_STOP=1 \
              -c 'BEGIN; DROP INDEX public."pos_sessions_userId_idx";' -f "$migration"; then
            echo "::error::Migration accepted a schema missing a required index"
            exit 1
          fi
          exists=$(psql "$DIRECT_URL" -X -A -t -c \
            "SELECT to_regclass('public.\"pos_sessions_userId_idx\"') IS NOT NULL")
          test "$exists" = "t"
          echo "POS_MIGRATION_DRIFT_REJECTED_AND_ROLLED_BACK_PASS"

      - name: Run DB-backed CRM, HR and Accounting E2E
        run: pnpm --filter @scc/api test:db-e2e

      - name: Lint backup/restore safety gate
        run: |
          bash -n scripts/pos-production-backup-restore-verify.sh
          grep -Fq 'production restore requires a distinct, verified PostgreSQL server endpoint' scripts/pos-production-backup-restore-verify.sh
          grep -Fq 'target_tables' scripts/pos-production-backup-restore-verify.sh
          echo 'SCC380_RESTORE_GUARD_SOURCE_CHECK_PASS'

      - name: Simulate SCC380 production-like backup and restore with populated data
        shell: bash
        run: |
          set -euo pipefail
          # This is a disposable CI database only; never connects to Render production.
          psql "$DIRECT_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO tenants ("id", "name", "slug", "updatedAt")
          VALUES ('pos-restore-fixture', 'POS isolated restore fixture', 'pos-restore-fixture', now());
          INSERT INTO chart_of_accounts ("id", "tenantId", "code", "name", "type", "updatedAt")
          VALUES ('pos-restore-account', 'pos-restore-fixture', '1110', 'Fixture cash', 'ASSET', now());
          INSERT INTO products ("id", "tenantId", "name", "sku", "costPrice", "salePrice", "currentStock", "updatedAt")
          VALUES ('pos-restore-product', 'pos-restore-fixture', 'Fixture inventory', 'POS-RESTORE-001', 3, 10, 2, now());
          SQL
          psql "postgresql://scc:scc@127.0.0.1:5432/postgres" -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE scc_pos_restored'
          mkdir -p "$RUNNER_TEMP/scc380-pos-restore"
          chmod 700 "$RUNNER_TEMP/scc380-pos-restore"
          docker run --rm --network host \
            -v "$PWD/scripts/pos-production-backup-restore-verify.sh:/verify-scc380.sh:ro" \
            -v "$RUNNER_TEMP/scc380-pos-restore:/backups" \
            -e DATABASE_URL="$DATABASE_URL" \
            -e RESTORE_DATABASE_URL='postgresql://scc:scc@127.0.0.1:5432/scc_pos_restored' \
            -e EXPECTED_SOURCE_DB=scc_test \
            -e BACKUP_DIR=/backups \
            postgres:17 bash /verify-scc380.sh
          restore_url='postgresql://scc:scc@127.0.0.1:5432/scc_pos_restored'
          test "$(psql "$restore_url" -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM tenants WHERE id='pos-restore-fixture'")" = "1"
          test "$(psql "$restore_url" -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM products WHERE id='pos-restore-product' AND \"currentStock\"=2")" = "1"
          test "$(psql "$restore_url" -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM chart_of_accounts WHERE id='pos-restore-account' AND type='ASSET'")" = "1"
          original_migrations=$(psql "$DIRECT_URL" -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM _prisma_migrations")
          restored_migrations=$(psql "$restore_url" -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM _prisma_migrations")
          test "$original_migrations" = "$restored_migrations"
          test "$original_migrations" -gt 0
          echo 'SCC380_POPULATED_SCHEMA_ARCHIVE_AND_RESTORE_PASS'

      - name: Verify POS atomic financial transaction and user preferences on RESTORED database
        env:
          CRM_DB_E2E: '1'
          DATABASE_URL: postgresql://scc:scc@127.0.0.1:5432/scc_pos_restored
          DIRECT_URL: postgresql://scc:scc@127.0.0.1:5432/scc_pos_restored
        run: pnpm --filter @scc/api exec tsx --test --test-concurrency=1 test/pos-atomic-db.e2e.spec.ts

      - name: P0 replay migrations and exercise real tenant permissions ON RESTORED database
        env:
          CRM_DB_E2E: '1'
          DATABASE_URL: postgresql://scc:scc@127.0.0.1:5432/scc_pos_restored
          DIRECT_URL: postgresql://scc:scc@127.0.0.1:5432/scc_pos_restored
        shell: bash
        run: |
          set -euo pipefail
          # This is a disposable, populated restored CI database. It is NOT
          # Render production and must never be described as a production restore.
          test "$(psql "$DIRECT_URL" -XAt -v ON_ERROR_STOP=1 -c 'SELECT current_database()')" = 'scc_pos_restored'
          test "$(psql "$DIRECT_URL" -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM tenants WHERE id='pos-restore-fixture'")" = '1'
          migrations_before="$(psql "$DIRECT_URL" -XAt -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM _prisma_migrations')"
          pnpm --filter @scc/database exec prisma migrate status --schema prisma/schema.prisma
          pnpm --filter @scc/database exec prisma migrate deploy --schema prisma/schema.prisma
          migrations_after="$(psql "$DIRECT_URL" -XAt -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM _prisma_migrations')"
          test "$migrations_before" -gt 0
          test "$migrations_before" = "$migrations_after"
          pnpm --filter @scc/api exec tsx --test --test-concurrency=1 \
            test/p0-tenant-role-isolation-db.e2e.spec.ts \
            test/p0-authenticated-tenant-switch-db.e2e.spec.ts
          test "$(psql "$DIRECT_URL" -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM tenants WHERE id='pos-restore-fixture'")" = '1'
          test "$(psql "$DIRECT_URL" -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM products WHERE id='pos-restore-product'")" = '1'
          echo 'PASS P0_CI_RESTORED_DB_MIGRATION_REPLAY_AND_TWO_COMPANY_ROLES'

      - name: Build API dependency graph
        run: pnpm turbo run build --filter=@scc/api...

      - name: Verify serverless handler export
        run: |
          node - <<'NODE'
          const handler = require('./apps/api/api/index.js');
          if (typeof handler !== 'function') {
            throw new Error('SERVERLESS_HANDLER_NOT_FUNCTION');
          }
          console.log('SERVERLESS_HANDLER_SMOKE_PASS');
          NODE

      - name: Initialize Nest routes on Express 4
        env:
          JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789abcdef
        run: |
          cd apps/api
          node - <<'NODE'
          const { NestFactory } = require('@nestjs/core');
          const { ExpressAdapter } = require('@nestjs/platform-express');
          const expressModule = require('express');
          const express = expressModule.default || expressModule;
          const { AppModule } = require('./dist/app.module.js');

          (async () => {
            const server = express();
            const app = await NestFactory.create(AppModule, new ExpressAdapter(server), { logger: false });
            await app.init();
            await app.close();
            console.log('NEST_ROUTE_INIT_PASS');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Acceptance - login JSON reaches authentication through real HTTP
        env:
          JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789abcdef
          PORT: "3101"
        run: |
          set -euo pipefail
          node apps/api/dist/main.js > /tmp/scc-api-http-acceptance.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/scc-api-http-acceptance.log
              echo "::error::API process exited before HTTP acceptance"
              exit 1
            fi
            if curl -s --max-time 2 -o /dev/null http://127.0.0.1:3101/; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            tail -n 80 /tmp/scc-api-http-acceptance.log
            echo "::error::API did not become ready"
            exit 1
          fi

          login_status=$(curl --max-time 20 -sS -o /tmp/scc-login-http-response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"email":"diagnostic@example.invalid","password":"diagnostic-only"}' \
            http://127.0.0.1:3101/auth/login)
          echo "SYNTHETIC_LOGIN_HTTP=$login_status"
          if [ "$login_status" != "401" ]; then
            cat /tmp/scc-login-http-response.json
            echo "::error::Expected 401 on well-formed synthetic credentials"
            exit 1
          fi

          malformed_status=$(curl --max-time 10 -sS -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"email":"not-an-email","password":""}' \
            http://127.0.0.1:3101/auth/login)
          echo "INVALID_DTO_HTTP=$malformed_status"
          if [ "$malformed_status" != "400" ]; then
            echo "::error::Expected 400 for invalid login DTO"
            exit 1
          fi
          echo "AUTH_LOGIN_HTTP_ACCEPTANCE_PASS"
