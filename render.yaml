databases:
  - name: scc-postgres
    databaseName: scc_main
    user: postgres
    plan: free

services:
  - type: web
    name: scc-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: scc-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: CORS_ORIGINS
        value: "https://scc380-web.vercel.app"
    healthCheckPath: /
