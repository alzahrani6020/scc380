services:
  - type: web
    name: scc380-api
    runtime: image
    plan: free
    region: frankfurt
    image:
      url: ghcr.io/alzahrani6020/scc380-api-prod:b2dce537a277d029202601f3fb1ba6853de330f9
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scc380-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: scc380-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: scc380-cache
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: CORS_ORIGINS
        value: https://dr-talal-h-alzahrani.com,https://www.dr-talal-h-alzahrani.com,https://scc380-web.vercel.app
      - key: WEB_URL
        value: https://dr-talal-h-alzahrani.com
      - key: NODE_ENV
        value: production

  - type: keyvalue
    name: scc380-cache
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

databases:
  - name: scc380-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: scc_main
    user: scc_app
    ipAllowList: []
