databases:
  - name: scc-postgres
    databaseName: scc_main
    user: sccuser
    plan: free
    region: frankfurt

services:
  - type: web
    name: scc-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install --frozen-lockfile && cd packages/database && npx prisma generate && pnpm --filter @scc/types build && pnpm --filter @scc/utils build && pnpm --filter @scc/database build && pnpm --filter @scc/auth build && pnpm --filter @scc/api build
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: scc-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: CORS_ORIGINS
        value: "https://*.onrender.com,https://*.vercel.app,https://scc380-web.vercel.app"
      - key: MINIO_ENDPOINT
        value: localhost
      - key: MINIO_PORT
        value: 9000
      - key: MINIO_ACCESS_KEY
        value: minioadmin
      - key: MINIO_SECRET_KEY
        value: minioadmin
      - key: OLLAMA_URL
        value: http://localhost:11434
    healthCheckPath: /
