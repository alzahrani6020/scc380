<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SCC - Smart Command Center</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; height: 100vh; display: flex; flex-direction: column; }
        .header { background: linear-gradient(135deg, #0066CC 0%, #004499 100%); padding: 15px 30px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .header h1 { font-size: 18px; display: flex; align-items: center; gap: 10px; }
        .badge { background: #f59e0b; color: #000; padding: 3px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .vip-info { background: rgba(255,255,255,0.1); padding: 10px 20px; display: flex; gap: 20px; align-items: center; font-size: 13px; }
        .vip-info span { opacity: 0.8; }
        .vip-info strong { color: #fbbf24; }
        iframe { flex: 1; width: 100%; border: none; background: white; }
        .controls { position: fixed; bottom: 20px; right: 20px; display: flex; gap: 10px; }
        .btn { background: #0066CC; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; box-shadow: 0 4px 12px rgba(0,102,204,0.4); transition: all 0.3s; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn:hover { background: #0055aa; transform: translateY(-2px); }
        .btn-vip { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; }
        .btn-vip:hover { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏢 مركز القيادة الذكي | Smart Command Center</h1>
        <span class="badge">⚡ VIP MODE</span>
    </div>
    <div class="vip-info">
        <span>👤 <strong>vip@scc.sa</strong></span>
        <span>🎖️ <strong>SUPER_ADMIN</strong></span>
        <span>🔓 <strong>بدون قيود</strong></span>
        <span>🌐 <strong>localhost:3000</strong></span>
    </div>
    <iframe src="http://localhost:3000/auth/login" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>
    <div class="controls">
        <a href="http://localhost:3001/api/docs" target="_blank" class="btn">📚 API Docs</a>
        <a href="http://localhost:3000/dashboard" target="_blank" class="btn btn-vip">⚡ Dashboard</a>
    </div>
</body>
</html>
