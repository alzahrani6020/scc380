<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>SCC - فتح المتصفح الداخلي</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; }
        .container { text-align: center; max-width: 600px; padding: 40px; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(90deg, #f59e0b, #fbbf24); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 30px; margin: 20px 0; backdrop-filter: blur(10px); }
        .url { background: #0f172a; padding: 15px 20px; border-radius: 8px; font-family: monospace; font-size: 1.1rem; color: #60a5fa; direction: ltr; margin: 15px 0; word-break: break-all; }
        .btn { display: inline-block; background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; padding: 16px 40px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 1.2rem; margin: 10px; transition: transform 0.2s; }
        .btn:hover { transform: scale(1.05); }
        .info { color: #94a3b8; margin-top: 20px; font-size: 0.9rem; }
        .badge { display: inline-block; background: #dc2626; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">⚡ VIP MODE</div>
        <h1>مركز القيادة الذكي</h1>
        <p style="color: #94a3b8; font-size: 1.1rem;">Smart Command Center Platform</p>
        
        <div class="card">
            <h3>🌐 رابط الوصول السريع</h3>
            <div class="url">http://localhost:3000/auth/login</div>
            <a href="http://localhost:3000/auth/login" class="btn">فتح الموقع</a>
        </div>
        
        <div class="card">
            <h3>👑 بيانات الدخول VIP</h3>
            <p><strong>البريد:</strong> vip@scc.sa</p>
            <p><strong>الرمز:</strong> vip123456</p>
            <p><strong>الصلاحية:</strong> SUPER_ADMIN</p>
        </div>
        
        <p class="info">📚 API Docs: http://localhost:3001/api/docs</p>
        <p class="info">⚙️ Admin Panel: http://localhost:3002</p>
    </div>
    <script>
        // Auto-redirect after 3 seconds
        setTimeout(() => {
            window.location.href = 'http://localhost:3000/auth/login';
        }, 3000);
    </script>
</body>
</html>
