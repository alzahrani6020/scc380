version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: scc-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: scc_main
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - scc-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scc-redis-prod
    restart: always
    volumes:
      - redis_prod_data:/data
    command: redis-server --appendonly yes
    networks:
      - scc-prod

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: scc-api-prod
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/scc_main
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      OLLAMA_URL: http://ollama:11434
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - scc-prod

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: scc-web-prod
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - scc-prod

  nginx:
    image: nginx:alpine
    container_name: scc-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api
    networks:
      - scc-prod

  ollama:
    image: ollama/ollama:latest
    container_name: scc-ollama-prod
    restart: always
    volumes:
      - ollama_prod_data:/root/.ollama
    networks:
      - scc-prod

networks:
  scc-prod:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  ollama_prod_data:
